name: Build snake for Termux (aarch64)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross-compile with Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CXX" --version
          # Object file
          "$CXX" -std=c++17 -O2 -fPIE -c snake_termux.cpp -o snake.o
          # Linked executable (runs in Termux)
          "$CXX" snake.o -pie -static-libstdc++ -o snake
          file snake.o snake || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snake-termux-aarch64
          path: |
            snake.o
            snake

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            snake.o
            snake
